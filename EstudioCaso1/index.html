<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Registro de Estudiantes</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Agregar Estudiante</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese el nombre">
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Ingrese los apellidos">
                </div>
                <div class="form-group">
                    <label for="nota">Nota (0 - 100)</label>
                    <input type="number" id="nota" min="0" max="100" placeholder="Ingrese la nota">
                </div>
                <p id="error-msg" class="error-msg"></p>
                <button type="submit">Agregar Estudiante</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Lista de Estudiantes</h2>
            <table id="students-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody id="students-body">
                </tbody>
            </table>
        </section>

        <section class="summary-section">
            <h2>Resumen de Notas</h2>
            <div class="summary-cards">
                <article class="summary-card">
                    <h3>Mayor Nota</h3>
                    <p id="max-note"></p>
                </article>
                <article class="summary-card">
                    <h3>Promedio</h3>
                    <p id="avg-note"></p>
                </article>
                <article class="summary-card">
                    <h3>Nota Más Baja</h3>
                    <p id="min-note"></p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>SC-502 Ambiente Web Cliente Servidor &mdash; Universidad Fidélitas</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
