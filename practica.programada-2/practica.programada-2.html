<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Manipulación del DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        #miParrafo {
            font-size: 1.2rem;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
            margin: 20px 0;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Manipulación del DOM</h1>

    <p id="miParrafo">Este es el texto original</p>

    <button id="btnCambiar">Cambiar contenido</button>

    <script>
        var boton = document.getElementById("btnCambiar");
        var parrafo = document.getElementById("miParrafo");

        var clickCount = 0;

        var mensajes = [
            "Texto uno",
            "Texto dos",
            "Texto tres",
            "Texto original"
        ];

        boton.addEventListener("click", function () {
            clickCount++;
            var index = clickCount % mensajes.length;
            parrafo.textContent = mensajes[index];
        });
    </script>
</body>
</html>
